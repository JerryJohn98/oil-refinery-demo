<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oil and Gas Water Injection Optimization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>Oil and Gas Water Injection Optimization</h1>
          <p>Interactive mockup with confidence scoring and actual response trend signals.</p>
        </div>
      </header>

      <section class="kpi-strip" aria-label="Optimization KPIs">
        <article class="kpi-card">
          <div class="kpi-label">Injection Efficiency</div>
          <div id="kpiEfficiency" class="kpi-value">--%</div>
        </article>
        <article class="kpi-card">
          <div class="kpi-label">Predicted Oil Uplift</div>
          <div id="kpiUplift" class="kpi-value">-- bopd</div>
        </article>
        <article class="kpi-card">
          <div class="kpi-label">Overpressure Risk</div>
          <div id="kpiRisk" class="kpi-value">--</div>
        </article>
        <article class="kpi-card">
          <div class="kpi-label">Energy per Injected Barrel</div>
          <div id="kpiEnergy" class="kpi-value">-- kWh/bbl</div>
        </article>
      </section>

      <section id="dashboard" class="dashboard-grid"></section>
    </main>
  </div>

  <template id="parameterTemplate">
    <article class="param-row">
      <div class="gauge-panel">
        <div class="panel-header">
          <h2 class="param-name"></h2>
          <span class="last-refresh"></span>
        </div>
        <div class="gauge-track">
          <div class="range low"></div>
          <div class="range optimal"></div>
          <div class="range high"></div>
          <div class="needle"></div>
        </div>
        <div class="tick-row"></div>
        <div class="gauge-values">
          <span class="actual-label"></span>
          <span class="units-label"></span>
        </div>
      </div>

      <div class="recommendation-panel">
        <div class="rec-head">
          <h3 class="rec-title"></h3>
          <span class="constraint-badge"></span>
        </div>
        <div class="rec-values">
          <div>
            <div class="metric-label">Injection Setpoint Lower</div>
            <div class="metric rec-lower"></div>
          </div>
          <div>
            <div class="metric-label">Injection Setpoint Upper</div>
            <div class="metric rec-upper"></div>
          </div>
        </div>
        <div class="delta-row">
          <span class="delta-label">Delta to target</span>
          <span class="delta-value"></span>
        </div>

        <div class="confidence-wrap">
          <div class="confidence-head">
            <span>Confidence Score</span>
            <span class="confidence-score"></span>
          </div>
          <div class="confidence-bar"><div class="confidence-fill"></div></div>
        </div>

        <div class="sparkline-wrap">
          <div class="sparkline-head">
            <span>Actual Response Trend</span>
            <span class="trend-tag"></span>
          </div>
          <svg class="sparkline" viewBox="0 0 280 72" preserveAspectRatio="none">
            <path class="sparkline-band"></path>
            <path class="sparkline-line"></path>
          </svg>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
